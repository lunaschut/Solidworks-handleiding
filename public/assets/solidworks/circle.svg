<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" style="background-color: #f1f5f9; border-radius: 12px; overflow: hidden;">
  <defs>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Top bar / Window Header -->
  <rect x="0" y="0" width="640" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
      <g>
        <text x="60" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Features</text>
        
      </g>
    
      <g>
        <text x="148" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Sketch</text>
        <rect x="112" y="34" width="72" height="3" rx="1.5" fill="#0284c7" />
      </g>
    
      <g>
        <text x="236" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Evaluate</text>
        
      </g>
    
      <g>
        <text x="324" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">DimXpert</text>
        
      </g>
    

  <!-- Ribbon Background -->
  <rect x="0" y="38" width="640" height="118" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Divider line -->
  <line x1="0" y1="38" x2="640" y2="38" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tool buttons -->
  
      <g>
        <rect x="20" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Sketch Pencil & Grid -->
        <rect x="42" y="82" width="28" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <line x1="48" y1="82" x2="48" y2="106" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="58" y1="82" x2="58" y2="106" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="42" y1="94" x2="70" y2="94" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <!-- Red/Yellow Pencil -->
        <path d="M58,86 L66,94 L52,108 L46,106 L48,100 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
        <polygon points="46,106 44,109 49,108" fill="#1e293b" />
      
        <text x="56" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Sketch</text>
      </g>
    
      <g>
        <rect x="100" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Caliper / Dimension Arrows -->
        <line x1="124" y1="84" x2="124" y2="104" stroke="#0f172a" stroke-width="2" />
        <line x1="148" y1="84" x2="148" y2="104" stroke="#0f172a" stroke-width="2" />
        <line x1="126" y1="94" x2="146" y2="94" stroke="#2563eb" stroke-width="2" />
        <polygon points="126,94 131,90 131,98" fill="#2563eb" />
        <polygon points="146,94 141,90 141,98" fill="#2563eb" />
        <rect x="130" y="88" width="12" height="12" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
        <text x="136" y="97" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">50</text>
      
        
        <text x="136" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Smart</text>
        <text x="136" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Dimension</text>
      
      </g>
    
      <g>
        <rect x="180" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Sketch Pencil & Grid -->
        <rect x="202" y="82" width="28" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <line x1="208" y1="82" x2="208" y2="106" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="218" y1="82" x2="218" y2="106" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="202" y1="94" x2="230" y2="94" stroke="#bae6fd" stroke-width="1" stroke-dasharray="2 2" />
        <!-- Red/Yellow Pencil -->
        <path d="M218,86 L226,94 L212,108 L206,106 L208,100 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
        <polygon points="206,106 204,109 209,108" fill="#1e293b" />
      
        <text x="216" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Line</text>
      </g>
    
      <g>
        <rect x="260" y="68" width="72" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        
        <!-- Sketch Circle -->
        <circle cx="296" cy="94" r="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
        <circle cx="296" cy="94" r="2" fill="#dc2626" />
        <line x1="296" y1="94" x2="304" y2="86" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 1" />
        <circle cx="304" cy="86" r="2" fill="#dc2626" />
      
        <text x="296" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Circle</text>
      </g>
    
      <g>
        <rect x="340" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Sketch Rectangle -->
        <rect x="364" y="84" width="24" height="20" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
        <circle cx="364" cy="84" r="2.5" fill="#dc2626" />
        <circle cx="388" cy="104" r="2.5" fill="#dc2626" />
      
        <text x="376" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Rectangle</text>
      </g>
    

  <!-- Red highlight ring & pointer -->
  
    <!-- Glowing Red Highlight Frame/Circle -->
    <rect x="256" y="64" width="80" height="84" rx="12" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="none" filter="url(#redGlow)" />
    <!-- Pulse badge -->
    <rect x="254" y="54" width="84" height="20" rx="10" fill="#dc2626" />
    <text x="296" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HIER KLIKKEN</text>
    <!-- Arrow pointer -->
    <polygon points="291,74 301,74 296,80" fill="#dc2626" />
  

  <!-- Footer information strip -->
  <rect x="0" y="156" width="640" height="44" fill="#0f172a" />
  
  <!-- Location pin icon -->
  <circle cx="28" cy="178" r="8" fill="#ef4444" fill-opacity="0.2" />
  <circle cx="28" cy="178" r="4" fill="#ef4444" />
  
  <text x="44" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
    CommandManager > Tabblad Sketch > Cirkel gereedschap
  </text>

  
    <rect x="490" y="166" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="555" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">
      Sneltoets: Sneltoets S > Circle
    </text>
  
</svg>