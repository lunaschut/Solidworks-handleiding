<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" style="background-color: #f1f5f9; border-radius: 12px; overflow: hidden;">
  <defs>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Top bar / Window Header -->
  <rect x="0" y="0" width="640" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
      <g>
        <text x="60" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Features</text>
        <rect x="24" y="34" width="72" height="3" rx="1.5" fill="#0284c7" />
      </g>
    
      <g>
        <text x="148" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Sketch</text>
        
      </g>
    
      <g>
        <text x="236" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Evaluate</text>
        
      </g>
    
      <g>
        <text x="324" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">DimXpert</text>
        
      </g>
    

  <!-- Ribbon Background -->
  <rect x="0" y="38" width="640" height="118" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Divider line -->
  <line x1="0" y1="38" x2="640" y2="38" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tool buttons -->
  
      <g>
        <rect x="20" y="68" width="72" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        
        <!-- New Document / Part Template -->
        <polygon points="46,82 60,82 66,88 66,106 46,106" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="60,82 60,88 66,88" fill="#bae6fd" stroke="#0284c7" stroke-width="1" />
        <!-- Red SolidWorks cube icon -->
        <rect x="52" y="93" width="8" height="8" rx="1" fill="#dc2626" />
      
        
        <text x="56" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">New</text>
        <text x="56" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Part</text>
      
      </g>
    
      <g>
        <rect x="100" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- New Document / Part Template -->
        <polygon points="126,82 140,82 146,88 146,106 126,106" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="140,82 140,88 146,88" fill="#bae6fd" stroke="#0284c7" stroke-width="1" />
        <!-- Red SolidWorks cube icon -->
        <rect x="132" y="93" width="8" height="8" rx="1" fill="#dc2626" />
      
        
        <text x="136" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Open</text>
        <text x="136" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Doc</text>
      
      </g>
    
      <g>
        <rect x="180" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- New Document / Part Template -->
        <polygon points="206,82 220,82 226,88 226,106 206,106" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="220,82 220,88 226,88" fill="#bae6fd" stroke="#0284c7" stroke-width="1" />
        <!-- Red SolidWorks cube icon -->
        <rect x="212" y="93" width="8" height="8" rx="1" fill="#dc2626" />
      
        
        <text x="216" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Save</text>
        <text x="216" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">(Ctrl+S)</text>
      
      </g>
    
      <g>
        <rect x="260" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Evaluate Measure Ruler / Tape -->
        <rect x="284" y="88" width="24" height="12" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
        <line x1="288" y1="88" x2="288" y2="93" stroke="#854d0e" stroke-width="1" />
        <line x1="292" y1="88" x2="292" y2="91" stroke="#854d0e" stroke-width="1" />
        <line x1="296" y1="88" x2="296" y2="93" stroke="#854d0e" stroke-width="1" />
        <line x1="300" y1="88" x2="300" y2="91" stroke="#854d0e" stroke-width="1" />
        <line x1="304" y1="88" x2="304" y2="93" stroke="#854d0e" stroke-width="1" />
      
        
        <text x="296" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Options</text>
        <text x="296" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Units</text>
      
      </g>
    

  <!-- Red highlight ring & pointer -->
  
    <!-- Glowing Red Highlight Frame/Circle -->
    <rect x="16" y="64" width="80" height="84" rx="12" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="none" filter="url(#redGlow)" />
    <!-- Pulse badge -->
    <rect x="14" y="54" width="84" height="20" rx="10" fill="#dc2626" />
    <text x="56" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HIER KLIKKEN</text>
    <!-- Arrow pointer -->
    <polygon points="51,74 61,74 56,80" fill="#dc2626" />
  

  <!-- Footer information strip -->
  <rect x="0" y="156" width="640" height="44" fill="#0f172a" />
  
  <!-- Location pin icon -->
  <circle cx="28" cy="178" r="8" fill="#ef4444" fill-opacity="0.2" />
  <circle cx="28" cy="178" r="4" fill="#ef4444" />
  
  <text x="44" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
    Hoofdwerkbalk linksboven > New (Ctrl+N) > Kies Part sjabloon
  </text>

  
    <rect x="490" y="166" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="555" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">
      Sneltoets: Ctrl+N
    </text>
  
</svg>