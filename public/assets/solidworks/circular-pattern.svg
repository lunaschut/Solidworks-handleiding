<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" style="background-color: #f1f5f9; border-radius: 12px; overflow: hidden;">
  <defs>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Top bar / Window Header -->
  <rect x="0" y="0" width="640" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
      <g>
        <text x="60" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Features</text>
        <rect x="24" y="34" width="72" height="3" rx="1.5" fill="#0284c7" />
      </g>
    
      <g>
        <text x="148" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Sketch</text>
        
      </g>
    
      <g>
        <text x="236" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Evaluate</text>
        
      </g>
    
      <g>
        <text x="324" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">DimXpert</text>
        
      </g>
    

  <!-- Ribbon Background -->
  <rect x="0" y="38" width="640" height="118" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Divider line -->
  <line x1="0" y1="38" x2="640" y2="38" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tool buttons -->
  
      <g>
        <rect x="20" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Hole Wizard / Counterbore Drill -->
        <rect x="48" y="84" width="16" height="5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="51,89 61,89 61,100 56,105 51,100" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
        <!-- Thread lines -->
        <line x1="52" y1="92" x2="60" y2="94" stroke="#0369a1" stroke-width="1" />
        <line x1="52" y1="96" x2="60" y2="98" stroke="#0369a1" stroke-width="1" />
        <circle cx="64" cy="86" r="4" fill="#f59e0b" />
        <text x="64" y="88" font-family="sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>
      
        
        <text x="56" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Hole</text>
        <text x="56" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Wizard</text>
      
      </g>
    
      <g>
        <rect x="100" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Fillet Curved Corner -->
        <path d="M126,84 L126,104 L146,104" fill="none" stroke="#94a3b8" stroke-width="2" />
        <path d="M126,94 Q126,104 136,104" fill="none" stroke="#2563eb" stroke-width="3" />
        <circle cx="132" cy="98" r="1.5" fill="#dc2626" />
        <line x1="132" y1="98" x2="127" y2="100" stroke="#dc2626" stroke-width="1" />
        <text x="139" y="91" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#2563eb">R</text>
      
        <text x="136" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Fillet</text>
      </g>
    
      <g>
        <rect x="180" y="68" width="72" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        
        <!-- Circular Pattern 4 items in circle -->
        <circle cx="216" cy="94" r="11" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" />
        <circle cx="216" cy="85" r="3" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
        <circle cx="225" cy="94" r="3" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
        <circle cx="216" cy="103" r="3" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
        <circle cx="207" cy="94" r="3" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
        <path d="M212,90 A5,5 0 0,1 220,98" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      
        
        <text x="216" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Circular</text>
        <text x="216" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Pattern</text>
      
      </g>
    
      <g>
        <rect x="260" y="68" width="72" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Extruded 3D Cube -->
        <!-- Back top face -->
        <polygon points="290,82 306,82 300,90 284,90" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
        <!-- Front face -->
        <polygon points="284,90 300,90 300,104 284,104" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
        <!-- Right side face -->
        <polygon points="300,90 306,82 306,96 300,104" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
        <!-- Upward extrusion arrow -->
        <line x1="292" y1="98" x2="292" y2="86" stroke="#f59e0b" stroke-width="2" />
        <polygon points="292,84 289,88 295,88" fill="#f59e0b" />
      
        <text x="296" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Shell</text>
      </g>
    

  <!-- Red highlight ring & pointer -->
  
    <!-- Glowing Red Highlight Frame/Circle -->
    <rect x="176" y="64" width="80" height="84" rx="12" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="none" filter="url(#redGlow)" />
    <!-- Pulse badge -->
    <rect x="174" y="54" width="84" height="20" rx="10" fill="#dc2626" />
    <text x="216" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HIER KLIKKEN</text>
    <!-- Arrow pointer -->
    <polygon points="211,74 221,74 216,80" fill="#dc2626" />
  

  <!-- Footer information strip -->
  <rect x="0" y="156" width="640" height="44" fill="#0f172a" />
  
  <!-- Location pin icon -->
  <circle cx="28" cy="178" r="8" fill="#ef4444" fill-opacity="0.2" />
  <circle cx="28" cy="178" r="4" fill="#ef4444" />
  
  <text x="44" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
    CommandManager > Tabblad Features > Dropdown Linear Pattern > Circular Pattern
  </text>

  
    <rect x="490" y="166" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="555" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">
      Sneltoets: Onder Linear Pattern pijltje
    </text>
  
</svg>